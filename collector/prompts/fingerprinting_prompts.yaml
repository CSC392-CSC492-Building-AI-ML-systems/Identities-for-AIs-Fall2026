# Fingerprinting prompts: prompts designed to reveal which model is answering.
# Sources: LLMmap (Pasquini et al., USENIX Security 2025, Table C.2), V1 (configs/user_prompt_set.json),
# and 4 probes written for this project.
#
# group:          llmmap_original | our_probe | v1_creative (saved as prompt_group in each response record)
# save_response:  full | refusal_only (store only whether the model refused, not the text;
#                 used for LM-02 so harmful instructions are never stored)

prompts:
