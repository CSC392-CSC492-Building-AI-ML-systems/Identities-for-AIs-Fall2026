    official_url: "https://www.anthropic.com/legal/commercial-terms"
    effective_date: null                # binding from when you accept the terms or first use the API
    commercial_use: allowed             # through an API account
    conditions:
      - "Follow the Usage Policy, Supported Regions Policy and Service Specific Terms (D.2)"
      - "Customer keeps rights in inputs and owns outputs; Anthropic assigns its rights in outputs to the customer (B)"
    restrictions:
      - "No using the Services to build a competing product, including training competing AI models; no reverse engineering or reselling (D.4)"
      - "Provided 'as is'; no warranty that outputs are accurate (L.2)"
      - "Outside the EEA, Switzerland and UK: California law; disputes go to arbitration in San Francisco (M.7, J.2)"
    usage_policy_url: "https://www.anthropic.com/aup"
    usage_policy_version: "The page shows a version effective 2026-11-12"
    usage_policy_bank_relevant:
      - "Finance and credit are high-risk areas: a qualified person must meaningfully review AI recommendations, with authority to change them"
      - "People receiving advice or a decision in a high-risk area must be told AI was used"
      - "Customer-facing chatbots must tell users they are talking to AI, at least at the start of each session"
      - "No discriminatory practices; no collecting or accessing private information without permission"
    data_use: "Anthropic may not train models on customer content from the Services (B)."
    ip_indemnity: "Anthropic defends paid customers against third-party IP claims about their use or outputs, with exclusions (K.1)"
    derivatives_inherit: null
    derivatives_note: "Not applicable; the model is only accessed through the API."
    bank_note: "Usable by a bank through an API account. Credit and financial recommendations need review by a qualified person, and customers must be told they are talking to AI. Anthropic does not train on API data."
    retrieved_at: 2026-10-12